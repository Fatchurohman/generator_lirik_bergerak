<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suno Sync Lyric Generator</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; max-width: 600px; margin: auto; }
    .card { background: #1e293b; padding: 20px; border-radius: 12px; border: 1px solid #334155; display: flex; flex-direction: column; gap: 12px; }
    
    /* Styling Identitas Developer dengan Animasi Kelap-Kelip Live */
    .developer-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #94a3b8;
      margin-top: -6px;
      margin-bottom: 4px;
    }
    .live-dot {
      width: 8px;
      height: 8px;
      background-color: #ef4444;
      border-radius: 50%;
      display: inline-block;
      box-shadow: 0 0 0 rgba(239, 68, 68, 0.4);
      animation: pulse-live 1.5s infinite;
    }
    @keyframes pulse-live {
      0% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
      }
      70% {
        transform: scale(1);
        box-shadow: 0 0 0 6px rgba(239, 68, 68, 0);
      }
      100% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 rgba(239, 68, 68, 0);
      }
    }

    textarea { background: #0f172a; border: 1px solid #334155; color: #fff; padding: 10px; border-radius: 8px; width: 100%; height: 120px; outline: none; box-sizing: border-box; }
    input[type="file"] { background: #0f172a; padding: 8px; border-radius: 8px; border: 1px solid #334155; color: #fff; width: 100%; box-sizing: border-box; }
    audio { width: 100%; margin-top: 10px; }
    .btn { background: #0284c7; color: #fff; border: none; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; }
    .btn:hover { background: #0369a1; }
    .btn-record { background: #10b981; font-size: 15px; padding: 14px; }
    .btn-record:hover { background: #059669; }
    .output-box { background: #0f172a; border: 1px solid #334155; padding: 12px; border-radius: 8px; font-family: monospace; font-size: 13px; white-space: pre-wrap; max-height: 200px; overflow-y: auto; color: #38bdf8; }
  </style>
</head>
<body>

  <div class="card">
    <h2>⏱️ Alat Perekam Waktu Lirik Otomatis</h2>
    
    <div class="developer-badge">
      <span class="live-dot"></span>
      <span>developer : fatur62</span>
    </div>

    <p style="font-size: 12px; color: #94a3b8;">1. Pilih file MP3 lagu kamu.<br>2. Ketik lirik per baris di bawah.<br>3. Putar lagu, lalu klik tombol hijau atau tekan **Spasi** pas lirik itu mulai dinyanyikan!</p>

    <div>
      <label>Pilih File MP3 Lagu:</label>
      <input type="file" id="audioUpload" accept="audio/mp3">
    </div>
    <audio id="audioPlayer" controls></audio>

    <div>
      <label>Masukkan Lirik Polos (Baris per baris):</label>
      <textarea id="rawLyrics" placeholder="(Intro - Musik mulai)&#10;Baris pertama lirik&#10;Baris kedua lirik"></textarea>
      <button class="btn" onclick="initLyricSession()" style="margin-top: 8px;">Mulai Sesi Tandai Lirik</button>
    </div>

    <div id="recordingSection" style="display:none; flex-direction:column; gap:10px;">
      <button class="btn btn-record" onclick="stampCurrentTime()">👉 TANDAI WAKTU UNTUK BARIS INI ([SPACEBAR])</button>
      <div id="currentLineDisplay" style="font-size: 14px; color: #38bdf8; font-weight: bold; text-align: center;">-</div>
    </div>

    <div>
      <label>Hasil Format Supabase (Synced Lyrics):</label>
      <div id="outputResult" class="output-box">Hasil akan muncul di sini...</div>
      <button class="btn" style="margin-top: 8px;" onclick="copyResult()">Salin Hasil untuk Supabase</button>
    </div>
  </div>

  <script>
    let lyricLines = [];
    let currentIndex = 0;
    let stampedResults = [];
    const audioPlayer = document.getElementById('audioPlayer');

    document.getElementById('audioUpload').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      if (audioPlayer.src && audioPlayer.src.startsWith('blob:')) {
        URL.revokeObjectURL(audioPlayer.src);
      }

      const fileURL = URL.createObjectURL(file);
      audioPlayer.src = fileURL;
      audioPlayer.load();
    });

    function initLyricSession() {
      const raw = document.getElementById('rawLyrics').value.trim();
      if (!raw) {
        alert('Masukkan lirik polos terlebih dahulu!');
        return;
      }
      if (!audioPlayer.src) {
        alert('Pilih file MP3 terlebih dahulu!');
        return;
      }

      lyricLines = raw.split('\n').map(l => l.trim()).filter(l => l !== '');
      currentIndex = 0;
      stampedResults = [];
      
      document.getElementById('recordingSection').style.display = 'flex';
      updateDisplay();
      audioPlayer.play().catch(() => {
        alert('Gagal memutar audio otomatis. Silakan tekan tombol Play pada pemutar audio.');
      });
    }

    function stampCurrentTime() {
      if (currentIndex >= lyricLines.length) {
        alert('Semua lirik sudah ditandai!');
        return;
      }

      const currentTime = Math.floor(audioPlayer.currentTime);
      const text = lyricLines[currentIndex];
      
      stampedResults.push(`${currentTime}:${text}`);
      document.getElementById('outputResult').innerText = stampedResults.join('\n');
      
      currentIndex++;
      updateDisplay();

      if (currentIndex >= lyricLines.length) {
        audioPlayer.pause();
        alert('Selesai! Semua waktu lirik berhasil direkam.');
      }
    }

    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && document.getElementById('recordingSection').style.display !== 'none') {
        e.preventDefault();
        stampCurrentTime();
      }
    });

    function updateDisplay() {
      if (currentIndex < lyricLines.length) {
        document.getElementById('currentLineDisplay').innerText = `Baris Berikutnya (${currentIndex + 1}/${lyricLines.length}): "${lyricLines[currentIndex]}"`;
      } else {
        document.getElementById('currentLineDisplay').innerText = '✅ Selesai ditandai semua!';
      }
    }

    function copyResult() {
      const text = document.getElementById('outputResult').innerText;
      navigator.clipboard.writeText(text).then(() => {
        alert('Hasil berhasil disalin! Tinggal paste ke kolom synced_lyrics di Supabase.');
      });
    }
  </script>
</body>
</html>
